[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eab"
version = "0.0.1"
description = "eab-kernel: entrance-block (E(A,B)) contact kernel — contact-cover enumeration, contact record contract, and cross-engine reconciliation gates"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
